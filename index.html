<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Key Shooter · Balloon Patrol</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a6bbf'/%3E%3Cellipse cx='16' cy='19' rx='10' ry='5' fill='white'/%3E%3Ccircle cx='11' cy='17' r='5' fill='white'/%3E%3Ccircle cx='18' cy='15' r='6' fill='white'/%3E%3Ccircle cx='23' cy='17' r='4' fill='white'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(to bottom, #1a6bbf 0%, #4da6e8 40%, #87CEEB 100%);
      overflow: hidden;
      height: 100vh;
      font-family: 'Courier New', monospace;
    }


    #songs {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 100;
      white-space: nowrap;
    }

    .song-btn {
      background: rgba(255,255,255,0.65);
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 24px;
      padding: 8px 18px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #1a6bbf;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s;
      text-shadow: none;
    }
    .song-btn:hover  { background: rgba(255,255,255,0.88); }
    .song-btn.active { background: #1a6bbf; color: #fff; border-color: #1a6bbf; }

    #hint {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    #score {
      position: fixed;
      top: 20px;
      right: 28px;
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      letter-spacing: 2px;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    #game { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #hint, #score { z-index: 2; }
    #score { top: 70px; }
    #songs { max-width: calc(100% - 24px); overflow-x: auto; }
    .song-btn { flex-shrink: 0; }
    @media (max-width: 600px) {
      #songs { left: 12px; transform: none; }
      .song-btn { padding: 8px 12px; }
      #hint { font-size: 10px; letter-spacing: 1px; padding: 0 12px; }
      #score { right: 16px; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Balloon shooting drifting asteroids"></canvas>
  <div id="songs">
    <button class="song-btn active" data-song="abc">ABC Song</button>
    <button class="song-btn" data-song="old_macdonald">Old MacDonald</button>
    <button class="song-btn" data-song="ants">Ants Go Marching</button>
    <button class="song-btn" data-song="row">Row Your Boat</button>
    <button class="song-btn" data-song="wheels">Wheels on the Bus</button>
  </div>
  <div id="hint">Press any key to shoot</div>
  <div id="score">HITS: <span id="hits">0</span> &nbsp; SHOTS: <span id="count">0</span></div>

  <script>
    // ── Audio ────────────────────────────────────────────────────
    const AC = new (window.AudioContext || window.webkitAudioContext)();

    const C4=261.63, D4=293.66, E4=329.63, F4=349.23, Fs4=369.99, G4=392.00, A4=440.00, B4=493.88,
          C5=523.25, D5=587.33, E5=659.25,
          D3=146.83, F3=174.61, A3=220.00, Bb3=233.08,
          Bb4=466.16, G3=196.00;

    const SONGS = {
      old_macdonald: {
        label: 'Old MacDonald',
        notes: [
          // "Old MacDonald had a farm"
          F4, F4, F4, C4, D4, D4, C4,
          // "E-I-E-I-O"
          A4, A4, G4, G4, F4,
          // "And on his farm he had a duck"
          C4, F4, F4, F4, C4, D4, D4, C4,
          // "E-I-E-I-O"
          A4, A4, G4, G4, F4,
          // "With a quack quack here, and a quack quack there"
          C4, F4, F4, F4, C4, F4, F4, F4,
          // "Here a quack, there a quack, everywhere a quack quack"
          F4, F4, F4, F4, F4, F4, F4, F4, F4, F4, F4, F4, C4, D4, D4, C4,
          // "E-I-E-I-O"
          A4, A4, G4, G4, F4,
          // "Old MacDonald had a farm, E-I-E-I-O"
          C4, F4, F4, F4, C4, D4, D4, C4,
          A4, A4, G4, G4, F4,
        ],
      },
      abc: {
        label: 'ABC Song',
        notes: [
          // "A B C D E F G"
          C4, C4, G4, G4, A4, A4, G4,
          // "H I J K L-M-N-O-P"
          F4, F4, E4, E4, D4, D4, C4,
          // "Q R S, T U V"
          G4, G4, F4, F4, E4, E4, D4,
          // "W X, Y and Z"
          G4, G4, F4, F4, E4, E4, D4,
          // "Now I know my ABCs"
          C4, C4, G4, G4, A4, A4, G4,
          // "Next time won't you sing with me"
          F4, F4, E4, E4, D4, D4, C4,
        ],
      },
      ants: {
        label: 'Ants Go Marching',
        notes: [
          // "The ants go marching one by one"
          B4, E4, Fs4, G4, Fs4, G4, E4, D4, B4, D4,
          // "The ants go marching one by one"
          B4, E4, Fs4, G4, Fs4, G4, A4, B4, A4, B4,
          // "the little one stops to suck his thumb"
          G4, A4, B4, B4, B4, A4, A4, A4,
          // "and they all go marching down, to the ground, to get out of the rain"
          Fs4, G4, G4, Fs4, E4, Fs4, Fs4, A4, B4, A4, G4, Fs4, E4,
          // "boom boom boom"
          B4, E4, B4, E4, B4, E4, B4,
        ],
      },
      row: {
        label: 'Row Your Boat',
        notes: [
          // "Row row row your boat"
          C4, C4, C4, D4, E4,
          // "gently down the stream"
          E4, D4, E4, F4, G4,
          // "merrily merrily merrily merrily"
          C5, C5, C5, G4, G4, G4, E4, E4, E4, C4, C4, C4,
          // "life is but a dream"
          G4, F4, E4, D4, C4,
        ],
      },
      wheels: {
        label: 'Wheels on the Bus',
        notes: [
          // Extracted note-for-note from MIDI (F major)
          // "The wheels on the bus go 'round and 'round"
          C4, F4, F4, F4, F4, A4, C5, A4, F4,
          // "'round and 'round, 'round and 'round"
          G4, G4, G4, E4, D4, C4, C4,
          // "The wheels on the bus go 'round and 'round"
          F4, F4, F4, F4, A4, C5, A4, F4, G4,
          // "all through the town"
          C4, F4,
        ],
      },
    };

    let currentSong = 'abc';
    let noteIndex   = 0;

    document.querySelectorAll('.song-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentSong = btn.dataset.song;
        noteIndex   = 0;
        document.querySelectorAll('.song-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        btn.blur();
      });
    });

    function pew() {
      const notes = SONGS[currentSong].notes;
      const freq  = notes[noteIndex % notes.length];
      noteIndex++;

      const gain = AC.createGain();
      gain.connect(AC.destination);

      [freq, freq * 2].forEach(f => {
        const osc = AC.createOscillator();
        osc.connect(gain);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, AC.currentTime);
        osc.start(AC.currentTime);
        osc.stop(AC.currentTime + 1.8);
      });

      gain.gain.setValueAtTime(0, AC.currentTime);
      gain.gain.linearRampToValueAtTime(0.28, AC.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 1.8);
    }

    // ── X positions by e.code ────────────────────────────────────
    const CODE_X = {
      'Escape':0.035,
      'F1':0.112,'F2':0.160,'F3':0.208,'F4':0.256,
      'F5':0.328,'F6':0.376,'F7':0.424,'F8':0.472,
      'F9':0.544,'F10':0.592,'F11':0.640,'F12':0.688,
      'Backquote':0.105,
      'Digit1':0.158,'Digit2':0.217,'Digit3':0.275,'Digit4':0.334,'Digit5':0.392,
      'Digit6':0.451,'Digit7':0.510,'Digit8':0.568,'Digit9':0.627,'Digit0':0.685,
      'Minus':0.744,'Equal':0.802,'Backspace':0.888,
      'Tab':0.114,
      'KeyQ':0.187,'KeyW':0.246,'KeyE':0.304,'KeyR':0.363,'KeyT':0.422,
      'KeyY':0.480,'KeyU':0.539,'KeyI':0.597,'KeyO':0.656,'KeyP':0.714,
      'BracketLeft':0.773,'BracketRight':0.831,'Backslash':0.876,
      'CapsLock':0.118,
      'KeyA':0.202,'KeyS':0.260,'KeyD':0.319,'KeyF':0.378,'KeyG':0.436,
      'KeyH':0.495,'KeyJ':0.553,'KeyK':0.612,'KeyL':0.671,
      'Semicolon':0.729,'Quote':0.788,'Enter':0.888,
      'ShiftLeft':0.055,
      'KeyZ':0.231,'KeyX':0.290,'KeyC':0.348,'KeyV':0.407,'KeyB':0.465,
      'KeyN':0.524,'KeyM':0.583,'Comma':0.641,'Period':0.700,'Slash':0.758,
      'ShiftRight':0.908,
      'ControlLeft':0.045,'AltLeft':0.138,'MetaLeft':0.212,
      'Space':0.500,
      'MetaRight':0.720,'AltRight':0.794,'ControlRight':0.932,
      'Insert':0.820,'Home':0.862,'PageUp':0.904,
      'Delete':0.820,'End':0.862,'PageDown':0.904,
      'ArrowLeft':0.766,'ArrowDown':0.810,'ArrowRight':0.854,'ArrowUp':0.810,
      'NumLock':0.740,'NumpadDivide':0.780,'NumpadMultiply':0.820,'NumpadSubtract':0.860,
      'Numpad7':0.740,'Numpad8':0.780,'Numpad9':0.820,'NumpadAdd':0.860,
      'Numpad4':0.740,'Numpad5':0.780,'Numpad6':0.820,
      'Numpad1':0.740,'Numpad2':0.780,'Numpad3':0.820,'NumpadEnter':0.860,
      'Numpad0':0.760,'NumpadDecimal':0.820,
    };

    // Physical keyboard rows, from the function row down to the space bar.
    const CODE_ROW = Object.fromEntries([
      'Escape F1 F2 F3 F4 F5 F6 F7 F8 F9 F10 F11 F12 PrintScreen ScrollLock Pause',
      'Backquote Digit1 Digit2 Digit3 Digit4 Digit5 Digit6 Digit7 Digit8 Digit9 Digit0 Minus Equal Backspace Insert Home PageUp NumLock NumpadDivide NumpadMultiply NumpadSubtract',
      'Tab KeyQ KeyW KeyE KeyR KeyT KeyY KeyU KeyI KeyO KeyP BracketLeft BracketRight Backslash Delete End PageDown Numpad7 Numpad8 Numpad9 NumpadAdd',
      'CapsLock KeyA KeyS KeyD KeyF KeyG KeyH KeyJ KeyK KeyL Semicolon Quote Enter Numpad4 Numpad5 Numpad6',
      'ShiftLeft KeyZ KeyX KeyC KeyV KeyB KeyN KeyM Comma Period Slash ShiftRight ArrowUp Numpad1 Numpad2 Numpad3 NumpadEnter',
      'ControlLeft AltLeft MetaLeft Space MetaRight AltRight ControlRight ArrowLeft ArrowDown ArrowRight Numpad0 NumpadDecimal',
    ].flatMap((keys, row) => keys.split(' ').map(code => [code, row])));

    const KEY_LABEL = {
      ' ':'SPC','Tab':'⇥','Enter':'↵','Backspace':'⌫','Delete':'⌦',
      'Escape':'ESC','CapsLock':'⇪','Shift':'⇧',
      'Control':'⌃','Alt':'⌥','Meta':'⌘',
      'ArrowUp':'↑','ArrowDown':'↓','ArrowLeft':'←','ArrowRight':'→',
      'Home':'HOM','End':'END','PageUp':'PGU','PageDown':'PGD',
      'Insert':'INS','PrintScreen':'PRT','ScrollLock':'SCL','Pause':'PAU',
      'NumLock':'NUM',
      'F1':'F1','F2':'F2','F3':'F3','F4':'F4','F5':'F5','F6':'F6',
      'F7':'F7','F8':'F8','F9':'F9','F10':'F10','F11':'F11','F12':'F12',
    };

    function getLabel(e) {
      if (KEY_LABEL[e.key]) return KEY_LABEL[e.key];
      if (e.key.length === 1) return e.key.toUpperCase();
      return e.key.slice(0, 4).toUpperCase();
    }

    function getFontSize(label) {
      if (label.length <= 1) return '84px';
      if (label.length === 2) return '60px';
      if (label.length === 3) return '45px';
      return '33px';
    }

    const palette = [
      '#ff6b6b','#ffd93d','#6bcb77','#4d96ff',
      '#ff9a3c','#c77dff','#00b4d8','#f72585','#56cfe1','#80ffdb'
    ];
    let ci = 0, shots = 0, hits = 0;
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let width, height, lastTime, spawnClock = 0;
    const bullets = [], asteroids = [], sparks = [];
    function resize() {
      width = innerWidth; height = innerHeight;
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = width * dpr; canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', resize);
    resize();
    // Match the original CSS cubic-bezier(0.15, 0.7, 0.35, 1).
    function shootEase(progress) {
      const curve = (t, a, b) => 3 * (1-t) ** 2 * t * a + 3 * (1-t) * t*t * b + t ** 3;
      let low = 0, high = 1;
      for (let i = 0; i < 24; i++) {
        const mid = (low + high) / 2;
        if (curve(mid, .15, .35) < progress) low = mid; else high = mid;
      }
      return curve((low + high) / 2, .7, 1);
    }
    function updateShot(shot) {
      const progress = Math.min(1, shot.age / shot.duration);
      const eased = shootEase(progress);
      // Keep the entire bubble inside the viewport at launch, including edge keys.
      const radius = Math.min(102, Math.max(1, (width - 16) / 2), Math.max(1, (height - 16) / 2));
      const bottomRowY = Math.max(radius + 8, height - radius - 24);
      const rowSpacing = Math.min(22, Math.max(0, (bottomRowY - radius - 8) / 5));
      const startY = bottomRowY - (5 - shot.row) * rowSpacing;
      // Fit the keyboard across the safe launch area; do not collapse edge keys together.
      shot.x = radius + 8 + shot.xFraction * Math.max(0, width - 2 * (radius + 8));
      shot.scale = (radius / 102) * (1 - .5 * eased);
      shot.r = 102 * shot.scale;
      shot.y = startY + (-height * .1 - radius - startY) * eased;
      shot.opacity = progress <= .8 ? 1 : 1 - shootEase((progress - .8) / .2);
    }

    function spawnAsteroid() {
      const r = 20 + Math.random() * 24;
      const x = Math.random() * width;
      // Every rock enters above the screen, heading toward a different point below.
      const travelTime = 7 + Math.random() * 5;
      asteroids.push({ x, y: -r - 10, r,
        vx: (Math.random() * width - x) / travelTime,
        vy: (height + r * 3) / travelTime,
        angle: Math.random() * Math.PI * 2, spin: (Math.random() - .5) * 1.6,
        shape: Array.from({length: 11}, () => .78 + Math.random() * .22) });
    }
    function fire(x, label, row = 3) {
      if (document.hidden) return;
      document.getElementById('count').textContent = ++shots;
      const shot = {xFraction: x / width, row, age: 0, duration: Number((Math.random() * 3 + 4).toFixed(2)),
        color: palette[ci++ % palette.length], label};
      updateShot(shot);
      bullets.push(shot);
      if (bullets.length > 6) bullets.shift();
      // Audio must never prevent the visual response to a keypress.
      try {
        if (AC.state === 'suspended') AC.resume().catch(() => {});
        pew();
      } catch (error) {
        console.warn('Shot audio unavailable', error);
      }
    }
    document.addEventListener('keydown', e => {
      if (e.repeat) return;
      if (document.activeElement?.classList.contains('song-btn') &&
          ['Tab', 'Enter', ' '].includes(e.key)) return;
      e.preventDefault();
      fire((CODE_X[e.code] ?? .5) * width, getLabel(e), CODE_ROW[e.code] ?? 3);
    });

    function burst(rock, color) {
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2, speed = 50 + Math.random() * 150;
        sparks.push({x: rock.x, y: rock.y, vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed, life: .65, color, r: 2 + Math.random() * 5});
      }
    }
    function frame(time) {
      const dt = lastTime === undefined ? 0 : Math.min((time - lastTime) / 1000, .04);
      lastTime = time;
      if (!document.hidden) {
        spawnClock -= dt;
        if (spawnClock <= 0) { spawnAsteroid(); spawnClock = .7 + Math.random() * .7; }
        ctx.clearRect(0, 0, width, height);
        for (let i = asteroids.length - 1; i >= 0; i--) {
          const rock = asteroids[i];
          rock.x += rock.vx * dt; rock.y += rock.vy * dt; rock.angle += rock.spin * dt;
          if (rock.y - rock.r > height || rock.x < -rock.r * 2 || rock.x > width + rock.r * 2) { asteroids.splice(i, 1); continue; }
        }
        for (let i = bullets.length - 1; i >= 0; i--) {
          const shot = bullets[i], previousY = shot.y;
          shot.age += dt;
          updateShot(shot);
          // Sweep the shot's path so fast shots cannot skip over a rock.
          const hit = asteroids.findIndex(rock => {
            const closestY = Math.max(shot.y, Math.min(previousY, rock.y));
            return Math.hypot(shot.x - rock.x, closestY - rock.y) < rock.r + shot.r;
          });
          if (hit !== -1) {
            // Keep the key balloon visible for its original flight even after a hit.
            burst(asteroids[hit], shot.color); asteroids.splice(hit, 1);
            document.getElementById('hits').textContent = ++hits;
          }
          if (shot.age >= shot.duration) bullets.splice(i, 1);
        }
        for (const rock of asteroids) {
          ctx.save(); ctx.translate(rock.x, rock.y); ctx.rotate(rock.angle);
          ctx.fillStyle = '#796e80'; ctx.strokeStyle = '#b9a8b4'; ctx.lineWidth = 3;
          ctx.beginPath();
          rock.shape.forEach((radius, i) => {
            const angle = i / rock.shape.length * Math.PI * 2;
            const x = Math.cos(angle) * rock.r * radius, y = Math.sin(angle) * rock.r * radius;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          });
          ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#514d65';
          for (const [x,y,r] of [[-.3,-.2,.23],[.35,.15,.17],[-.15,.45,.12]]) {
            ctx.beginPath(); ctx.arc(x * rock.r, y * rock.r, r * rock.r, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
        }
        for (const shot of bullets) {
          ctx.fillStyle = shot.color; ctx.globalAlpha = .3 * shot.opacity;
          ctx.fillRect(shot.x - 9 * shot.scale, shot.y + shot.r,
            18 * shot.scale, 78 * shot.scale);
          ctx.globalAlpha = shot.opacity;
          ctx.beginPath(); ctx.arc(shot.x, shot.y, shot.r, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.font = '900 ' + (parseFloat(getFontSize(shot.label)) * shot.scale) + 'px monospace';
          ctx.fillText(shot.label, shot.x, shot.y);
        }
        for (let i = sparks.length - 1; i >= 0; i--) {
          const p = sparks[i]; p.life -= dt;
          if (p.life <= 0) { sparks.splice(i, 1); continue; }
          p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 100 * dt;
          ctx.globalAlpha = p.life / .65; ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      requestAnimationFrame(frame);
    }
    document.addEventListener('visibilitychange', () => { lastTime = undefined; });
    requestAnimationFrame(frame);
  </script>
</body>
</html>
